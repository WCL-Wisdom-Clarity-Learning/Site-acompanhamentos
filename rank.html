<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rank</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<header class="topbar">

  <nav class="topnav">

<script src="script.js"></script>
<script>
// trigger bar animations after content load
document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    document.querySelectorAll('.rank-row .bar span').forEach(function(s){
      s.style.width = s.getAttribute('data-width') || s.style.width;
    });
  },300);
});
</script>
