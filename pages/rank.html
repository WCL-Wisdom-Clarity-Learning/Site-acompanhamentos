<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rank — W.C.L</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="site-header"><div class="container"><a href="../index.html" class="logo"><img src="img/logo.png" alt="Logo" class="site-logo"> W.C.L 🚀</a></div></header>
<main class="container">
<h1>Rank Kits por PDV</h1>
<p>Visualização estruturada do relatório.</p>
<img src="../img/Rank_Kits_por_PDV-640.webp" alt="Rank Kits" style="width:100%;border-radius:12px;">

<figure class="responsive-figure">
  <picture>
    <source type="image/webp" srcset="../img/Rank_Kits_por_PDV-320.webp 320w, ../img/Rank_Kits_por_PDV-640.webp 640w, ../img/Rank_Kits_por_PDV-1024.webp 1024w" sizes="(max-width:640px) 100vw, 640px">
    <img src="../img/Rank_Kits_por_PDV-640.webp" alt="Rank Kits" style="width:100%;border-radius:12px;" loading="lazy">
  </picture>
  <figcaption>Rank Kits por PDV — imagem gerada e otimizada.</figcaption>
</figure>
<canvas id="rankChart" width="800" height="400" style="max-width:100%;margin-top:20px"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const ctx = document.getElementById('rankChart').getContext('2d');
const labels = ['PDV A','PDV B','PDV C','PDV D','PDV E','PDV F'];
const data = [120, 95, 80, 65, 50, 30];
new Chart(ctx, {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{ label: 'Kits vendidos', data: data, borderRadius:6, backgroundColor: 'rgba(255,122,24,0.9)'}]
  },
  options: {responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true}}}
});
</script>

</main>
<script>
fetch('../data.json').then(r=>r.json()).then(d=>{
 const ctx=document.getElementById('rankChart');
 new Chart(ctx,{type:'bar',data:{labels:d.labels,datasets:[{label:'Kits',data:d.values}]}});
});
</script>
</body>
</html>
