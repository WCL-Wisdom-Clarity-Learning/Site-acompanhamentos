
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contribuições</title>
<style>
body{margin:0;background:#0d0d0d;color:white;font-family:Arial;}
header{padding:16px;display:flex;align-items:center;gap:12px;}
.container{padding:20px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.card{background:#1a1a1a;border-radius:18px;overflow:hidden;}
.card img{width:100%;height:130px;object-fit:cover;cursor:pointer;}
.card h3{text-align:center;padding:10px;}
@media(max-width:600px){
    .grid-3{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<header>
<img src="../img/logo.png" class="site-logo">
<h2>Contribuições</h2>
</header>

<div class="container">
<div class="grid-3">
    <div class="card"><img src="../img/c1.webp" onclick="location.href='https://google.com'"><h3>Projeto 1</h3></div>
    <div class="card"><img src="../img/c2.webp" onclick="location.href='https://github.com'"><h3>Projeto 2</h3></div>
    <div class="card"><img src="../img/c3.webp" onclick="location.href='https://openai.com'"><h3>Projeto 3</h3></div>
</div>
</div>
</body>
</html>
