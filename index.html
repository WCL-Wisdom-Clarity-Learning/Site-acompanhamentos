<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamentos | W.C.L</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./assets/responsive-overrides.css">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>

    <!-- CABEÇALHO NOVO -->
    <header class="header">
        <div class="logo-area">
            <img src="img/logo.png" alt="Logo W.C.L" class="logo-img">
            <span class="logo-text">W.C.L 🚀</span>
        </div>
        <h1 class="titulo-header">Acompanhamentos</h1>
    </header>

    <!-- SEÇÃO PRINCIPAL -->
    <main class="container">

        <div class="cards-wrapper">

            <!-- CARD 1 - RANK LOJA -->
            <div class="card" onclick="mostrarRank('loja')">
                <img src="img/Meta-Atingida.png" class="card-img" alt="Rank Loja">
                <p class="card-title">Rank Loja</p>
            </div>

            <!-- CARD 2 - RANK VD -->
            <div class="card" onclick="mostrarRank('vd')">
                <img src="img/Meta-Atingida.png" class="card-img" alt="Rank VD">
                <p class="card-title">Rank VD</p>
            </div>

        </div>

        <!-- ÁREA DO GRÁFICO -->
        <section id="graficoArea" class="grafico-area oculto">
            <button class="btn-voltar" onclick="voltar()">← Voltar</button>
            <h2 id="tituloRank"></h2>
            <div id="graficoRank"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
