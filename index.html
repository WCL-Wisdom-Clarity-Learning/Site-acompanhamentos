
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W.C.L 🚀</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{margin:0;background:#0d0d0d;color:white;font-family:Arial;}
header{padding:16px;display:flex;align-items:center;gap:12px;}
.site-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;}
.container{padding:20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.card{background:#1a1a1a;border-radius:18px;overflow:hidden;box-shadow:0 4px 12px #0007;}
.card img{width:100%;height:140px;object-fit:cover;cursor:pointer;}
.card h3{text-align:center;padding:10px;font-size:1rem;}
.mobile-title{text-align:center;font-size:1.4rem;margin-bottom:20px;}
@media(max-width:600px){
    .grid-2{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<header>
<img src="img/DESENVOLVIDOPOR.png" class="site-logo" alt="Logo">
<h2>W.C.L 🚀</h2>
</header>

<div class="container">
<h2 class="mobile-title">Selecione um Ranking</h2>
<div class="grid-2">
    <div class="card">
        <img src="img/Rank_Kits_por_PDV.webp" onclick="location.href='rank_loja.html'">
        <h3>Rank Loja</h3>
    </div>
    <div class="card">
        <img src="img/Rank_Kits_por_PDV.webp" onclick="location.href='rank_vd.html'">
        <h3>Rank VD</h3>
    </div>
</div>
</div>
</body>
</html>
