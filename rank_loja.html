
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rank Loja</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;background:#0d0d0d;color:white;font-family:Arial;padding:20px;}
header{padding:16px;display:flex;align-items:center;gap:12px;}
.site-logo{width:42px;height:42px;border-radius:50%;}
.chart-container{width:100%;max-width:450px;margin:auto;}
</style>
</head>
<body>
<header>
<img src="img/logo.png" class="site-logo">
<h2>Rank Loja</h2>
</header>

<div class="chart-container">
<canvas id="pyramidChart"></canvas>
</div>

<script>
const labels=["1º","2º","3º","4º","5º"];
const values=[100,80,60,40,20];
new Chart(document.getElementById("pyramidChart"),{
    type:"bar",
    data:{labels:labels,datasets:[{label:"Rank (%)",data:values}]},
    options:{
        indexAxis:"y",
        scales:{x:{beginAtZero:true,max:100}}
    }
});
</script>
</body>
</html>
