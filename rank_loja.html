
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rank Loja</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;background:#0d0d0d;color:white;font-family:Arial;padding:20px;}
header{padding:16px;display:flex;align-items:center;gap:12px;}
.site-logo{width:42px;height:42px;border-radius:50%;}
.chart-container{width:100%;max-width:450px;margin:auto;}
</style>

<style>
.main-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#0d0d0d;border-bottom:1px solid #333;}
.main-header .left{display:flex;align-items:center;gap:10px;}
.main-header .menu a{margin:0 10px;color:white;text-decoration:none;font-size:0.95rem;}
.main-header .menu a:hover{color:#ff7a00;}
.main-header .icons a{margin-left:10px;color:white;text-decoration:none;}
.contact-btn{background:#ff7a00;padding:6px 14px;border-radius:8px;color:white;}
.site-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;}
</style>

</head>
<body>

<header class="main-header">
  <div class="left">
    <img src="img/DESENVOLVIDOPOR.png" class="site-logo" alt="Logo">
    <h2>W.C.L 🚀</h2>
  </div>
  <nav class="menu">
    <a href="index.html">Início</a>
    <a href="pages/contribuicoes.html">Contribuições</a>
    <a href="pages/opensource.html">OpenSource</a>
    <a href="rank_loja.html">Rank Loja</a>
    <a href="rank_vd.html">Rank VD</a>
  </nav>
  <div class="icons">
    <a href="#"><span>in</span></a>
    <a href="#"><span>ig</span></a>
    <a href="#"><span>yt</span></a>
    <a href="#"><span>gh</span></a>
    <a href="pages/contato.html" class="contact-btn">Contato</a>
  </div>
</header>


<div class="chart-container">
<canvas id="pyramidChart"></canvas>
</div>

<script>
const labels=["1º","2º","3º","4º","5º"];
const values=[100,80,60,40,20];
new Chart(document.getElementById("pyramidChart"),{
    type:"bar",
    data:{labels:labels,datasets:[{label:"Rank (%)",data:values}]},
    options:{
        indexAxis:"y",
        scales:{x:{beginAtZero:true,max:100}}
    }
});
</script>
</body>
</html>
